<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WorkBridge — Contracts</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#0f172a',
            muted: '#475569',
            bgsoft: '#f8fafc',
            accent: '#6366f1',
            accentSoft: '#e0e7ff'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bgsoft font-sans">

<!-- HEADER -->
<header class="sticky top-0 bg-white shadow z-50 px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-2">
    <div class="w-9 h-9 bg-accent text-white flex items-center justify-center font-bold rounded-lg">W</div>
    <span class="font-semibold text-lg text-ink">WorkBridge</span>
  </div>
  <a href="index.html" class="btn-primary px-3 py-2 rounded-lg text-white bg-accent hover:bg-indigo-700 flex items-center gap-2">
    <i class="fas fa-home"></i> Dashboard
  </a>
</header>

<main class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-indigo-600 mb-2">Active Contracts</h1>
  <p class="text-slate-600 mb-6">Track progress and earnings of your ongoing projects.</p>

  <div id="contractsGrid" class="grid md:grid-cols-2 gap-6"></div>
</main>

<script src="js/contracts.js"></script>
</body>
</html>
