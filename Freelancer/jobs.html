<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WorkBridge — Find Jobs</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Global Styles -->
   <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#0f172a',
            muted: '#475569',
            bgsoft: '#f8fafc',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bgsoft text-ink font-sans">

<!-- HEADER -->
<header class="sticky top-0 bg-white/90 backdrop-blur border-b z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
    <!-- Logo & Site Name -->
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-accent text-white rounded-lg flex items-center justify-center font-bold shadow-[0_6px_20px_rgba(99,102,241,0.45)]">
        W
      </div>
      <span class="font-semibold text-lg text-ink">WorkBridge</span>
    </div>

    <!-- Dashboard Link -->
    <a href="index.html"
       class="flex items-center gap-2 bg-accent text-white px-3 py-2 rounded-lg shadow hover:bg-indigo-700 transition font-semibold">
      <i class="fas fa-home"></i> Dashboard
    </a>

  </div>
</header>
<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <!-- <aside class="w-64 bg-white shadow h-screen p-4">
    <nav class="space-y-2">
      <a href="index.html" class="nav-btn block">Overview</a>
      <a href="jobs.html" class="nav-btn active block">Find Jobs</a>
      <a href="proposals.html" class="nav-btn block">Proposals</a>
      <a href="contracts.html" class="nav-btn block">Contracts</a>
      <a href="earnings.html" class="nav-btn block">Earnings</a>
      <a href="messages.html" class="nav-btn block">Messages</a>
      <a href="profile.html" class="nav-btn block">Profile</a>
    </nav>
  </aside> -->

  <!-- MAIN -->
  <main class="flex-1 p-6 space-y-6">

    <!-- PAGE HEADING -->
    <div>
      <h1 class="text-3xl font-bold text-indigo-600 mb-2">Find Jobs</h1>
      <p class="text-slate-600 mb-6">
        Explore curated opportunities that match your skills.
      </p>
    </div>

    <!-- SEARCH + FILTER -->
    <div class="bg-white p-4 rounded-2xl shadow flex flex-col md:flex-row gap-4">
      <input
        id="searchInput"
        class="input"
        placeholder="Search by role, company, skills..."
      />

      <select id="categoryFilter" class="input md:w-60">
        <option>All Categories</option>
        <option>Web Development</option>
        <option>UI / UX</option>
        <option>Data Science</option>
        <option>Machine Learning</option>
        <option>DevOps</option>
        <option>Mobile Development</option>
      </select>
    </div>

    <!-- JOB CARDS -->
    <div id="jobList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </main>
</div>

<script src="js/jobs.js"></script>
</body>
</html>
