<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WorkBridge — Find Jobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#0f172a',
            muted: '#475569',
            bgsoft: '#f8fafc',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="bg-gray-50 font-sans">

<!-- Header with Dashboard Link -->
<!-- Header with Dashboard Link -->
<div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
  
  <!-- Logo & Site Name on the left -->
  <div class="flex items-center gap-2">
    <div
      class="w-9 h-9 rounded-lg bg-accent text-white flex items-center justify-center font-bold
             shadow-[0_6px_20px_rgba(99,102,241,0.45)]">
      W
    </div>
    <span class="font-semibold text-lg text-gray-900">WorkBridge</span>
  </div>

  <!-- Dashboard link on the right -->
  <a href="index.html" 
     class="flex items-center gap-2 bg-accent text-white px-3 py-2 rounded-lg
            shadow hover:bg-indigo-700 transition font-semibold">
    <i class="fas fa-home"></i> Dashboard
  </a>
</div>


<main class="p-6 max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-6 section-title text-indigo-600">Find Jobs</h1>

  <!-- Search / Filter -->
  <div class="flex flex-col md:flex-row gap-4 mb-6">
    <input type="text" id="searchInput" placeholder="Search by role or company..." class="input flex-1"/>
    <select id="statusFilter" class="input w-40">
      <option value="">All Status</option>
      <option>Interviewed</option>
      <option>Hired</option>
      <option>Rejected</option>
    </select>
    <button id="searchBtn" class="btn-primary w-36">Search</button>
  </div>

  <!-- Job Cards -->
  <div id="jobList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<script src="js/jobs.js"></script>
</body>
</html>
