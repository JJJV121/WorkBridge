<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Apply — WorkBridge</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#0f172a',
            muted: '#475569',
            bgsoft: '#f8fafc',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bgsoft text-ink font-sans">

<!-- Header -->
<header class="sticky top-0 bg-white/90 backdrop-blur border-b z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    
    <!-- Logo & Site Name -->
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-accent text-white rounded-lg flex items-center justify-center font-bold shadow-[0_6px_20px_rgba(99,102,241,0.45)]">
        W
      </div>
      <span class="font-semibold text-lg text-ink">WorkBridge</span>
    </div>

    <!-- Dashboard Link -->
    <a href="index.html"
       class="flex items-center gap-2 bg-accent text-white px-3 py-2 rounded-lg shadow hover:bg-indigo-700 transition font-semibold">
      <i class="fas fa-home"></i> Dashboard
    </a>

  </div>
</header>

<!-- Page Heading -->
<header class="dashboard-nav flex justify-between items-center mt-6 px-6">
  <h2 class="text-3xl font-bold text-indigo-600 mb-2">Job Application</h2>
  <a href="jobs.html" class="btn-primary text-sm">← Back to Jobs</a>
</header>

<main class="container py-12 max-w-xl px-6">
  <div class="card bg-white p-6 rounded-2xl shadow space-y-6">

    <h3 class="text-3xl font-bold text-indigo-600 mb-2">
      Apply for this role
    </h3>

    <form class="space-y-4">

      <!-- Name -->
      <input class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" placeholder="Full Name" required>

      <!-- Email -->
      <input class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" placeholder="Email Address" type="email" required>

      <!-- Experience -->
      <select class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" required>
        <option value="">Select Experience</option>
        <option>0–1 year</option>
        <option>1–3 years</option>
        <option>3–5 years</option>
        <option>5+ years</option>
      </select>

      <!-- Preferred Job Type -->
      <select class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" required>
        <option value="">Preferred Job Type</option>
        <option>Full-time</option>
        <option>Part-time</option>
        <option>Contract</option>
        <option>Internship</option>
      </select>

      <!-- Portfolio / GitHub -->
      <input class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" placeholder="Portfolio / GitHub Link (Optional)">

      <!-- Resume Upload (Mandatory) -->
      <label class="block text-sm font-medium text-ink">Upload Resume <span class="text-red-500">*</span></label>
      <input type="file" class="input w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-accent" accept=".pdf,.doc,.docx" required>

      <!-- Additional Info -->
      <!-- Additional Info -->
<label class="block text-sm font-medium text-ink">Additional Details (Optional)</label>
<p class="text-muted text-sm mb-1">
  Share anything not included in your resume—special projects, achievements, skills, or experiences you want us to know about.
</p>
<textarea class="input w-full border border-gray-300 rounded-lg px-4 py-2 h-28 focus:ring-2 focus:ring-accent" 
          placeholder="E.g., personal projects, certifications, or unique experiences"></textarea>


      <!-- Cover Letter -->
      <!-- <textarea class="input w-full border border-gray-300 rounded-lg px-4 py-2 h-32 focus:ring-2 focus:ring-accent" placeholder="Cover Letter"></textarea> -->

      <!-- Submit -->
      <button type="submit" class="btn-primary w-full px-4 py-2 text-white bg-accent hover:bg-indigo-700 rounded-lg font-semibold transition">
        Submit Application
      </button>

    </form>
  </div>
</main>

</body>
</html>
