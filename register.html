<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account — WorkBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      colors: { accent: '#6366f1' }
    }
  }
}
</script>
</head>

<body class="bg-slate-50 font-sans text-slate-900">

<!-- HEADER -->
<header class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-2">
    <div class="w-9 h-9 rounded-lg bg-accent text-white flex items-center justify-center font-bold">
      W
    </div>
    <span class="font-semibold text-lg">WorkBridge</span>
  </div>
</header>

<!-- REGISTER -->
<section class="min-h-[calc(100vh-72px)] flex items-center justify-center px-6">
  <div class="w-full max-w-lg bg-white rounded-2xl p-8
              shadow-[0_20px_60px_rgba(15,23,42,0.12)]">

    <h1 class="text-2xl font-semibold text-center">
      Create your account
    </h1>
    <p class="text-sm text-slate-500 text-center mb-6">
      Join WorkBridge as a recruiter or freelancer
    </p>

    <!-- ROLE TOGGLE -->
    <div class="flex bg-slate-100 rounded-lg p-1 mb-6">
      <button type="button" id="recruiterBtn"
        onclick="setRole('recruiter')"
        class="flex-1 py-2 rounded-md bg-white shadow text-sm font-medium">
        Recruiter
      </button>
      <button type="button" id="freelancerBtn"
        onclick="setRole('freelancer')"
        class="flex-1 py-2 rounded-md text-sm text-slate-600">
        Freelancer
      </button>
    </div>

    <!-- FORM -->
    <form id="registerForm" class="space-y-4">

      <!-- ROLE -->
      <input type="hidden" name="role" id="roleInput" value="recruiter">

      <!-- NAME -->
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="firstName" required
          placeholder="First name"
          class="border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">

        <input type="text" id="lastName" required
          placeholder="Last name"
          class="border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">
      </div>

      <!-- EMAIL -->
      <input type="email" name="email" required
        placeholder="Email"
        class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">

      <!-- PASSWORD -->
      <input type="password" name="password" required
        placeholder="Password"
        class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">

      <!-- RECRUITER FIELDS -->
      <div id="recruiterFields" class="space-y-4">
        <input type="text" name="company_name"
          placeholder="Company name"
          class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">

        <input type="url" name="website"
          placeholder="Company website"
          class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">
      </div>

      <!-- FREELANCER FIELDS -->
      <div id="freelancerFields" class="space-y-4 hidden">
        <input type="text" name="skills"
          placeholder="Skills (e.g. React, PHP)"
          class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">

        <input type="number" name="hourly_rate"
          placeholder="Hourly rate"
          class="w-full border rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-accent">
      </div>

      <!-- SUBMIT -->
      <button type="submit"
        class="w-full bg-accent text-white py-3 rounded-lg
               font-medium shadow hover:shadow-lg transition">
        Create account
      </button>
    </form>

    <p class="text-sm text-center text-slate-500 mt-6">
      Already have an account?
      <a href="login.html" class="text-accent font-medium hover:underline">
        Login
      </a>
    </p>

  </div>
</section>

<script>
let currentRole = 'recruiter';

function setRole(role){
  currentRole = role;
  document.getElementById('roleInput').value = role;

  document.getElementById('recruiterFields').classList.toggle('hidden', role !== 'recruiter');
  document.getElementById('freelancerFields').classList.toggle('hidden', role !== 'freelancer');

  document.getElementById('recruiterBtn').classList.toggle('bg-white', role === 'recruiter');
  document.getElementById('recruiterBtn').classList.toggle('shadow', role === 'recruiter');

  document.getElementById('freelancerBtn').classList.toggle('bg-white', role === 'freelancer');
  document.getElementById('freelancerBtn').classList.toggle('shadow', role === 'freelancer');
}

/* SUBMIT HANDLER */
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const form = e.target;
  const fd = new FormData(form);

  // backend expects single "name"
  const fullName =
    document.getElementById('firstName').value.trim() + ' ' +
    document.getElementById('lastName').value.trim();

  fd.append('name', fullName);

  const res = await fetch('backend/register.php', {
    method: 'POST',
    body: fd
  });

  const data = await res.json();

  if (!data.success) {
    alert(data.error);
    return;
  }

  // CORRECT REDIRECTS
  if (data.role === 'recruiter') {
    window.location.href = 'recruiter-dashboard.html';
  } else {
    window.location.href = 'Freelancer/index.html';
  }
});
</script>

</body>
</html>
