<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WorkBridge — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="auth-container">
  <form class="auth-card" onsubmit="handleLogin(event)">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account</p>

    <input id="email" required type="email" placeholder="Email">
    <input id="password" required type="password" placeholder="Password">

    <button class="primary-btn">Login</button>

    <p class="bottom-text">
      Don’t have an account?
      <a href="register.html">Sign up</a>
    </p>
  </form>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();

  const fd = new FormData();
  fd.append("email", document.getElementById("email").value);
  fd.append("password", document.getElementById("password").value);

  fetch("backend/login.php", {
    method: "POST",
    body: fd
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location =
        data.role === "freelancer"
          ? "freelancer-dashboard.html"
          : "recruiter-dashboard.html";
    } else {
      alert(data.error);
    }
  })
  .catch(() => alert("Server error"));
}
</script>

</body>
</html>
