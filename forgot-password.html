<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WorkBridge — Reset Password</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forgot-password.css">
  <script defer src="js/global.js"></script>
</head>
<body class="bg-gray-50">
  <main class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white p-8 rounded-xl card">
      <div class="text-center mb-6">
        <i class="fas fa-briefcase text-indigo-600 text-3xl"></i>
        <h1 class="text-2xl font-bold mt-2">Reset your password</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your email to receive reset link.</p>
      </div>

      <form onsubmit="handleForgot(event)">
        <input id="resetEmail" type="email" required placeholder="Email address" class="w-full px-3 py-2 border rounded">
        <button class="w-full mt-4 py-2 bg-indigo-600 text-white rounded-lg">Send Reset Link</button>
      </form>

      <div class="mt-4 text-center">
        <a href="login.html" class="text-indigo-600"><i class="fas fa-arrow-left mr-1"></i> Back to Sign in</a>
      </div>
    </div>
  </main>

  <script>
    function handleForgot(e){
      e.preventDefault();
      alert('Reset link sent (demo).');
      window.location = 'login.html';
    }
  </script>
</body>
</html>
